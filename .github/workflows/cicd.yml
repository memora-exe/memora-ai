name: AI CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PORT: 3020
        run: pytest

  build-and-push:
    name: Build & Push Docker
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.repo.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lower case image name
        id: repo
        run: echo "image=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.repo.outputs.image }}:latest
            ${{ steps.repo.outputs.image }}:${{ github.sha }}

  deploy:
    name: VPS Pull & Deploy
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # ponytail: docker run with env-file; upgrade to docker-compose if managing shared networks
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_AI_DIR || '/opt/memora-ai' }}"
            IMAGE="${{ needs.build-and-push.outputs.image }}:latest"

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            cat << 'EOF' > .env
            ${{ secrets.ENV_FILE }}
            EOF

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true
            docker pull "$IMAGE"

            # ponytail: clear port 3020 across containers/host before binding
            docker rm -f memora-ai 2>/dev/null || true
            docker ps -aq --filter "publish=3020" | xargs -r docker rm -f 2>/dev/null || true
            fuser -k 3020/tcp 2>/dev/null || true
            kill -9 $(lsof -t -i:3020) 2>/dev/null || true
            sleep 1

            docker run -d \
              --name memora-ai \
              --restart unless-stopped \
              -p 3020:3020 \
              --env-file .env \
              "$IMAGE"
