[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memora-ai"
version = "1.0.0"
description = "Memora AI - Stateless gRPC Technical Proxy Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=4.25.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "unstructured>=0.16.0",
    "langchain-text-splitters>=1.0.0",
    "numpy>=1.26.0,<3.0.0",
    "networkx>=3.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "google-adk>=2.3.0",
    "litellm>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
